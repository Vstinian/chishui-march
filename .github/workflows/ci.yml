name: Frontend checks

on:
  push:
    branches: [main, feat/game-engine, feat/visual-system]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run smoke
      - run: npm run build
      - name: Bootstrap dependency lock
        run: node -e "console.log('CHISHUI_LOCK_BASE64=' + require('node:fs').readFileSync('package-lock.json').toString('base64'))"
